name: Application Deployment

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - "app/**"
      - ".github/workflows/application.yml"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy application
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Ansible installation
        run: ansible --version

      - name: Get Ansible SSM bucket
        id: ssm-bucket
        run: |
          BUCKET_NAME=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'innovatech-cs1-ansible-ssm-')].Name | [0]" \
            --output text)

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "No Ansible SSM bucket found"
            exit 1
          fi

          echo "Found SSM bucket: $BUCKET_NAME"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy application with Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            ansible/playbooks/webserver.yml \
            -e "ansible_aws_ssm_bucket_name=${{ steps.ssm-bucket.outputs.bucket_name }}"