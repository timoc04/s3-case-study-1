---
- name: Deploy Grafana
  hosts: monitoring
  become: true

  vars:
    grafana_image: grafana/grafana:13.3.0
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

  pre_tasks:
    - name: Check that an administrator password was supplied
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length >= 8
        fail_msg: Supply GRAFANA_ADMIN_PASSWORD with at least 8 characters.
      no_log: true

  tasks:
    - name: Create the data source provisioning directory
      ansible.builtin.file:
        path: /opt/monitoring/grafana/provisioning/datasources
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the Prometheus data source configuration
      ansible.builtin.copy:
        src: ../../monitoring/grafana/provisioning/datasources/prometheus.yml
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      register: grafana_datasource

    - name: Ensure the monitoring Docker network exists
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Create the Grafana data volume
      community.docker.docker_volume:
        name: grafana-data
        state: present

    - name: Create dashboard directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/monitoring/grafana/provisioning/dashboards
        - /opt/monitoring/grafana/dashboards

    - name: Copy the dashboard provider
      ansible.builtin.copy:
        src: ../../monitoring/grafana/provisioning/dashboards/default.yml
        dest: /opt/monitoring/grafana/provisioning/dashboards/default.yml
        owner: root
        group: root
        mode: "0644"
      register: grafana_dashboard_provider

    - name: Copy the SOAR dashboard
      ansible.builtin.copy:
        src: ../../monitoring/grafana/dashboards/soar-overview.json
        dest: /opt/monitoring/grafana/dashboards/soar-overview.json
        owner: root
        group: root
        mode: "0644"

    - name: Start Grafana
      community.docker.docker_container:
        name: grafana
        image: "{{ grafana_image }}"
        state: started
        restart_policy: unless-stopped
        restart: "{{ grafana_datasource.changed or grafana_dashboard_provider.changed }}"
        networks:
          - name: monitoring
        published_ports:
          - "127.0.0.1:3000:3000"
        volumes:
          - grafana-data:/var/lib/grafana
          - /opt/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
          - /opt/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
          - /opt/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
          GF_USERS_ALLOW_SIGN_UP: "false"
          GF_AUTH_ANONYMOUS_ENABLED: "false"
      no_log: true

    - name: Wait for Grafana readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        return_content: true
        status_code: 200
      register: grafana_health
      until: >-
        grafana_health.status | default(0) == 200
        and (grafana_health.json | default({})).get('database') == 'ok'
      retries: 30
      delay: 3

    - name: Display Grafana health
      ansible.builtin.debug:
        var: grafana_health.json