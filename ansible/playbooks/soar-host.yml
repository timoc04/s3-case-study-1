---
- name: Configure the SOAR Docker host
  hosts: soar
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create the SOAR application directory
      ansible.builtin.file:
        path: /opt/soar
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verify Docker daemon availability
      ansible.builtin.command:
        cmd: docker info
      changed_when: false

    - name: Display Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"