---
- name: Prepare the monitoring Docker host
  hosts: monitoring
  become: true

  tasks:
    - name: Install Docker and its Python module dependency
      ansible.builtin.dnf:
        name:
          - docker
          - python3-requests
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create the monitoring directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verify Docker daemon availability
      ansible.builtin.command:
        cmd: docker info
      changed_when: false

    - name: Get Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"