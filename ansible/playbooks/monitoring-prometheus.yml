---
- name: Deploy Prometheus
  hosts: monitoring
  become: true

  vars:
    prometheus_image: prom/prometheus:v3.5.0

  tasks:
    - name: Create the Prometheus configuration directory
      ansible.builtin.file:
        path: /opt/monitoring/prometheus
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the Prometheus configuration
      ansible.builtin.copy:
        src: ../../monitoring/prometheus/prometheus.yml
        dest: /opt/monitoring/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      register: prometheus_config

    - name: Create the monitoring Docker network
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Create the Prometheus data volume
      community.docker.docker_volume:
        name: prometheus-data
        state: present

    - name: Start Prometheus
      community.docker.docker_container:
        name: prometheus
        image: "{{ prometheus_image }}"
        state: started
        restart_policy: unless-stopped
        restart: "{{ prometheus_config.changed }}"
        networks:
          - name: monitoring
        published_ports:
          - "127.0.0.1:9090:9090"
        volumes:
          - /opt/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
          - prometheus-data:/prometheus
        command:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=7d
          - --storage.tsdb.retention.size=5GB

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
      register: prometheus_ready
      until: prometheus_ready.status | default(0) == 200
      retries: 30
      delay: 2

    - name: Verify Prometheus self-monitoring
      ansible.builtin.uri:
        url: 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22prometheus%22%7D'
        return_content: true
        status_code: 200
      register: prometheus_query
      until: >-
        (prometheus_query.json | default({})).get('data', {}).get('result', [])
        | selectattr('value.1', 'equalto', '1')
        | list
        | length > 0
      retries: 15
      delay: 3

    - name: Display self-monitoring result
      ansible.builtin.debug:
        var: prometheus_query.json