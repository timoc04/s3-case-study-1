---
- name: Configure Innovatech web servers
  hosts: webservers
  become: true
  serial: 1

  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create Innovatech web page
      ansible.builtin.copy:
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Innovatech Solutions</title>
          </head>
          <body>
              <h1>Innovatech Solutions</h1>
              <p>This web server was configured automatically using Ansible.</p>
              <p>Version: 2.0</p>
              <p>Server: {{ inventory_hostname }}</p>
          </body>
          </html>

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Install Amazon CloudWatch Agent
      ansible.builtin.dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Configure Amazon CloudWatch Agent
      ansible.builtin.copy:
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "namespace": "Innovatech/EC2",
              "append_dimensions": {
                "InstanceId": "${aws:InstanceId}",
                "AutoScalingGroupName": "${aws:AutoScalingGroupName}"
              },
              "metrics_collected": {
                "mem": {
                  "measurement": [
                    "mem_used_percent"
                  ],
                  "metrics_collection_interval": 60
                },
                "disk": {
                  "measurement": [
                    "used_percent"
                  ],
                  "metrics_collection_interval": 60,
                  "resources": [
                    "/"
                  ]
                }
              }
            }
          }

    - name: Start CloudWatch Agent with configuration
      ansible.builtin.command:
        cmd: >
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
          -a fetch-config
          -m ec2
          -s
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
      changed_when: true

    - name: Enable Amazon CloudWatch Agent
      ansible.builtin.service:
        name: amazon-cloudwatch-agent
        enabled: true
        state: started